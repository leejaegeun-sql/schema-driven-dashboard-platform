[pytest]
# Run from backend/ with: python -m pytest
pythonpath = .
testpaths = tests

# Warnings are errors: no application code may warn. The single exception below
# is pinned to an exact category, message prefix and originating module, so no
# other warning can pass through it.
filterwarnings =
    error
    # starlette 1.6 reads anyio.abc.BlockingPortal, an alias anyio >= 4.13
    # deprecated. It fires only while importing starlette's test client, which
    # nothing outside the test suite does -- the running application never
    # triggers it, and it is not suppressed at runtime. Upstream, not ours.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
